<div *ngIf="loading">
  <h3>Loading...</h3>
</div>

<div *ngIf="!loading">

  <h2>Courses</h2>

  <input
    type="text"
    placeholder="Search Course"
    [(ngModel)]="searchTerm">

  <div *ngFor="let course of filteredCourses">

    <app-course-card
      [name]="course.name"
      [code]="course.code"
      [credits]="course.credits"
      [grade]="course.grade">
    </app-course-card>

  </div>

  <div *ngIf="filteredCourses.length === 0">
    <h3>No courses found</h3>
  </div>

</div>
